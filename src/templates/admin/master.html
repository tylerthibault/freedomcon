{% extends 'admin/base.html' %}

{% block access_control %}
<ul class="nav navbar-nav navbar-right ms-2">
  <li class="nav-item">
    <span class="nav-link disabled" style="color:rgba(255,255,255,.5); font-size:.8rem; padding-top:.6rem;">
      {{ current_user.username }}
      <span class="badge ms-1" style="background:#BC2A27; font-size:.65rem; font-family:'Oswald',sans-serif; letter-spacing:.05em;">{{ current_user.role | upper }}</span>
    </span>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="{{ url_for('admin_auth.logout') }}" style="color:rgba(255,255,255,.75);">
      Logout
    </a>
  </li>
</ul>
{% endblock %}
